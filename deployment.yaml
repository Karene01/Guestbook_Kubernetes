apiVersion: apps/v1
kind: Deployment
metadata:
    name: my-deployment
spec:
    replicas: 2
    selector:
        matchLabels:
            app: guestbook
    template:
        metadata:
            labels:
                app: guestbook
        spec:
            containers:
            - name: guestbook-container
              image: guestbook:v0.1.0
              ports:
                - containerPort: 3000