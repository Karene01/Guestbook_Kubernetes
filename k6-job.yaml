apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: guestbook
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6
          args: ["run", "/scripts/load-test.js"]
          env:
            - name: GUESTBOOK_URL
              value: http://guestbook:3000
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
